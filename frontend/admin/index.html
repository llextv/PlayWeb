<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlayWeb</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="admin">
    <div class="background-glow">
      <div class="glow-1"></div>
      <div class="glow-2"></div>
    </div>
    <a class="skip-link" href="#content">Aller au contenu</a>
    <div id="root"></div>
    <div id="toast" class="toast-wrap" role="status" aria-live="polite"></div>

    <template id="toast-template"><div class="toast"></div></template>
    <template id="shell-template">
      <div class="app">
        <aside class="sidebar">
          <div class="brand">
            <span class="brand-mark">PW</span><span>PlayWeb</span>
          </div>
          <nav class="nav">
            <a class="btn-nav" data-view="shop" href="../index/index.html">
              <i data-lucide="store"></i><span>Jeux</span>
            </a>
            <a class="btn-nav" data-view="friends" href="../amis/index.html">
              <i data-lucide="users"></i><span>Amis</span>
            </a>
            <a class="btn-nav" data-view="achievements" href="../succes/index.html">
              <i data-lucide="trophy"></i><span>Succès</span>
            </a>
            <a class="btn-nav" data-view="leaderboard" href="../leaderboard/index.html">
              <i data-lucide="bar-chart"></i><span>Leaderboard</span>
            </a>
            <a class="btn-nav" data-view="profile" href="../profil/index.html">
              <i data-lucide="user"></i><span>Profil</span>
            </a>
            <a class="btn-nav" data-view="updates" href="../mises-a-jour/index.html">
              <i data-lucide="scroll-text"></i><span>Mises à jour</span>
            </a>
          </nav>
          <div class="side-foot">
            <div class="user-mini">
              <div class="avatar" data-user-avatar></div>
              <div class="grow">
                <b data-user-name></b><br /><span class="small muted"
                  >Niveau <span data-user-level></span
                ></span>
              </div>
              <button
                class="btn danger"
                style="padding: 8px"
                id="logout"
                title="Déconnexion"
              >
                <i data-lucide="log-out"></i>
              </button>
            </div>
          </div>
        </aside>
        <main class="main" id="content">
          <header class="topbar">
            <div>
              <h1 id="page-title"></h1>
            </div>
            <div class="top-actions">
              <button class="btn" id="quickProfile">
                <span data-quick-avatar></span> <span data-quick-name></span>
              </button>
            </div>
          </header>
          <div id="content-panel"></div>
        </main>
      </div>
    </template>

    <template id="login-template">
      <main class="login">
        <section class="token-modal-card">
          <div
            class="brand"
            style="margin: 0 0 28px; padding: 0; justify-content: center"
          >
            <span class="brand-mark">PW</span><span>PlayWeb</span>
          </div>
          <div class="eyebrow" style="text-align: center">Accès capsule</div>
          <h1 style="text-align: center">Reprenez<br />la partie.</h1>
          <p class="muted" style="text-align: center; margin-bottom: 24px">
            Entrez votre token de démo pour synchroniser votre identité.
          </p>
          <form id="loginForm" class="form">
            <input
              id="token"
              class="input"
              autocomplete="off"
              placeholder="demo-token-alice"
              required
            />
            <button class="btn-play">Ouvrir la capsule</button>
            <div
              id="error"
              class="hidden"
              style="
                color: var(--danger);
                text-align: center;
                font-weight: bold;
                margin-top: 10px;
              "
            ></div>
          </form>
          <div style="margin-top: 32px">
            <div
              class="eyebrow"
              style="text-align: center; margin-bottom: 12px"
            >
              Tokens de test
            </div>
            <div data-token-list></div>
          </div>
        </section>
      </main>
    </template>

    <template id="token-template">
      <div class="token">
        <code data-token-value></code
        ><button
          class="btn"
          style="padding: 6px 12px; font-size: 12px"
          data-token-use
        >
          Utiliser
        </button>
      </div>
    </template>

    <template id="shop-template">
      <div>
        <section
          class="card"
          style="
            margin-bottom: 24px;
            background: var(--primary-grad);
            border: none;
          "
        >
          <div class="eyebrow" style="color: #fff; opacity: 0.8">
            Bibliothèque
          </div>
          <h2 style="font-size: 36px; margin: 10px 0; font-weight: 900">
            Notre selection<br />de jeux.
          </h2>
          <p
            style="
              opacity: 0.9;
              max-width: 500px;
              margin-bottom: 20px;
              font-weight: 600;
            "
          >
            Lancez des expériences immersives et découvrez de nouvelles
            aventures en solo ou en multi !
          </p>
        </section>
        <div class="section-title">
          <h2>Jeux:</h2>
          <span class="muted small">3 jeux</span>
        </div>
        <div class="grid" id="games"></div>
      </div>
    </template>

    <template id="updates-template">
      <div class="updates-content">
        <section class="updates-card updates-intro">
          <div class="updates-card-header">
            <i data-lucide="scroll-text"></i>
            <div>
              <div class="eyebrow">Journal de développement</div>
              <h2>Mises à jour</h2>
            </div>
            <span class="version-badge">PlayWeb</span>
          </div>
          <p>
            Retrouve ici les nouveautés, améliorations et corrections apportées
            aux jeux disponibles sur PlayWeb.
          </p>
        </section>

        <section class="updates-card patchnote-card">
          <div class="updates-card-header">
            <i data-lucide="sparkles"></i>
            <h2>BrainrotStar</h2>
            <span class="version-badge">V1.0.0</span>
            <span class="version-date">15/09/2026</span>
          </div>

          <div class="patchnote-content">
            <div class="patchnote-section">
              <div class="patchnote-section-header">
                <i data-lucide="plus-circle"></i>
                <h3>Nouveautés</h3>
              </div>
              <ul class="patchnote-list">
                <li><span class="new-badge">NOUVEAU</span> Ajout de BrainrotStar sur PlayWeb</li>
                <li><span class="new-badge">NOUVEAU</span> Nouvelle carte de jeu dédiée au mode multi et solo</li>
                <li><span class="new-badge">NOUVEAU</span> Première base de patch notes centralisée</li>
              </ul>
            </div>

            <div class="patchnote-section">
              <div class="patchnote-section-header">
                <i data-lucide="zap"></i>
                <h3>Améliorations</h3>
              </div>
              <ul class="patchnote-list">
                <li><span class="improve-badge">AMÉLIORATION</span> Harmonisation de l'affichage des cartes de jeux</li>
                <li><span class="improve-badge">AMÉLIORATION</span> Interface responsive sur mobile et tablette</li>
              </ul>
            </div>

            <div class="patchnote-section">
              <div class="patchnote-section-header">
                <i data-lucide="wrench"></i>
                <h3>Corrections de bugs</h3>
              </div>
              <ul class="patchnote-list">
                <li><span class="fix-badge">FIX</span> Correction de l'affichage du mode MULTI sur les cartes de jeux</li>
                <li><span class="fix-badge">FIX</span> Correction du centrage des cartes dans la grille</li>
              </ul>
            </div>
          </div>
        </section>

        <section class="updates-card">
          <div class="updates-card-header">
            <i data-lucide="gamepad-2"></i>
            <h2>GambleKing</h2>
            <span class="version-badge">Bientôt</span>
          </div>
          <p class="updates-muted">
            Les prochaines informations et patch notes de GambleKing seront
            publiées ici.
          </p>
        </section>
      </div>
    </template>

    <template id="game-card-template">
      <article class="card game-card">
        <div class="cover" data-game-cover></div>
        <div class="card-body">
          <div class="row">
            <div>
              <b data-game-name></b>
              <div class="muted small" data-game-genre></div>
            </div>
            <span class="tag" data-game-mode></span>
          </div>
          <p class="muted small" data-game-desc></p>
          <div style="margin-top: auto">
            <button
              style="width: 100%"
              class="btn"
              data-action="launch"
              data-game-button
            ></button>
          </div>
        </div>
      </article>
    </template>
    <div id="game-modes" hidden>
      <span data-game-id="brainrotstar" data-game-mode="MULTI & SOLO"></span>
      <span data-game-id="gambleking" data-game-mode="MULTI & SOLO"></span>
      <span data-game-id="chess" data-game-mode="MULTI"></span>
    </div>

    <template id="library-template">
      <div>
        <div class="notice">
          <i
            data-lucide="shield-check"
            style="
              width: 18px;
              height: 18px;
              vertical-align: middle;
              margin-right: 6px;
            "
          ></i
          >Votre progression est sauvegardée localement dans cette capsule.
          Aucun serveur requis.
        </div>
        <div class="section-title"><h2 data-library-title></h2></div>
        <div class="grid" data-library-games></div>
      </div>
    </template>
    <template id="empty-library-template"
      ><div class="empty">
        Votre bibliothèque attend sa première aventure.
      </div></template
    >
    <template id="library-card-template"
      ><article class="card game-card">
        <div class="cover" data-game-cover></div>
        <div class="card-body">
          <b data-game-name></b>
          <div class="progress"><i data-game-progress></i></div>
          <div class="row small muted" style="margin-bottom: 12px">
            <span data-game-explored></span>
          </div>
          <button
            class="btn-play"
            style="width: 100%; font-size: 16px; padding: 12px"
            data-action="launch"
          >
            <i data-lucide="play" style="margin-right: 8px"></i> Jouer
          </button>
        </div>
      </article></template
    >

    <template id="friends-template"
      ><div class="grid two">
        <section class="card">
          <div class="section-title">
            <h2>Amis (<span data-friends-count></span>)</h2>
            <button class="btn" data-action="invite">＋ Ajouter</button>
          </div>
          <div class="list" data-friends-list></div>
        </section>
        <section class="card">
          <div class="eyebrow">Activité</div>
          <h2>Invitations à jouer</h2>
          <div class="empty">
            Aucune invitation en attente.<br /><span class="small"
              >Le chat reste hors fréquence, le jeu d'abord.</span
            >
          </div>
        </section>
      </div></template
    >
    <template id="friend-template"
      ><div class="list-item">
        <div class="avatar" data-friend-avatar></div>
        <div class="grow">
          <b data-friend-name></b>
          <div class="small" data-friend-status></div>
        </div>
        <button class="btn" data-action="play">Inviter</button>
      </div></template
    >

    <template id="achievements-template"
      ><div>
        <div class="card" style="margin-bottom: 24px">
          <div class="row">
            <div>
              <div class="eyebrow">Progression globale</div>
              <h2 style="font-size: 32px">
                <span data-done-count></span> /
                <span data-achievement-count></span> débloqués
              </h2>
            </div>
            <div class="stat" style="color: var(--accent)">68%</div>
          </div>
          <div class="progress"><i style="width: 68%"></i></div>
        </div>
        <div class="grid" data-achievements-list></div></div
    ></template>
    <template id="achievement-template"
      ><article class="card">
        <div class="row" style="margin-bottom: 12px">
          <div class="badge"><i data-achievement-icon></i></div>
          <span class="tag" data-achievement-rarity></span>
        </div>
        <h3 data-achievement-name></h3>
        <div class="muted small" data-achievement-game></div>
        <div
          style="margin-top: 15px; font-weight: bold"
          data-achievement-status
        ></div></article
    ></template>

    <template id="leaderboard-template"
      ><div>
        <div class="tabs">
          <button class="btn primary">Global</button
          ><button class="btn">Amis</button
          ><button class="btn">Cette saison</button
          ><button class="btn">Cette semaine</button>
        </div>
        <div class="card" style="padding: 0; overflow: hidden">
          <table class="table">
            <thead>
              <tr>
                <th>#</th>
                <th>Joueur</th>
                <th>Niveau</th>
                <th>XP</th>
                <th>Titre</th>
              </tr>
            </thead>
            <tbody data-leaderboard-list></tbody>
          </table>
        </div></div
    ></template>
    <template id="leaderboard-row-template"
      ><tr>
        <td data-rank></td>
        <td><b data-player></b></td>
        <td data-level></td>
        <td style="color: var(--accent); font-weight: bold" data-xp></td>
        <td class="muted" data-title></td></tr
    ></template>
    <template id="notifications-template"
      ><div
        class="card list"
        style="
          padding: 0;
          background: transparent;
          border: none;
          box-shadow: none;
        "
        data-notifications-list
      ></div
    ></template>
    <template id="notification-template"
      ><div class="list-item">
        <div class="badge"><i data-notification-icon></i></div>
        <div class="grow">
          <b data-notification-text></b>
          <div class="small muted" data-notification-age></div>
        </div>
        <span class="tag" data-notification-type></span></div
    ></template>
    <template id="profile-template"
      ><div class="grid two">
        <section class="card">
          <div class="row" style="margin-bottom: 20px">
            <div
              class="avatar"
              style="width: 72px; height: 72px; font-size: 28px"
              data-profile-avatar
            ></div>
            <span class="tag" data-profile-status></span>
          </div>
          <h2 style="font-size: 28px" data-profile-name></h2>
          <div class="muted" data-profile-title></div>
          <div class="progress"><i style="width: 74%"></i></div>
          <div class="row small">
            <span style="font-weight: bold" data-profile-level></span
            ><span class="muted" data-profile-xp></span>
          </div>
          <hr
            style="
              border-color: var(--card-border-strong);
              border-width: 1px 0 0;
              margin: 22px 0;
            "
          />
          <button class="btn" style="width: 100%" data-action="edit">
            Modifier le profil
          </button>
        </section>
        <section class="card">
          <div class="eyebrow">Sécurité</div>
          <h2 style="margin-bottom: 12px">Sessions & tokens</h2>
          <p class="muted small" style="margin-bottom: 20px">
            Token actuel :
            <code
              style="
                color: var(--accent);
                background: rgba(255, 255, 255, 0.1);
                padding: 4px 8px;
                border-radius: 6px;
              "
              data-session-token
            ></code>
          </p>
          <div class="list">
            <div class="list-item">
              <span class="badge"><i data-lucide="monitor"></i></span>
              <div class="grow">
                <b>Session navigateur</b>
                <div
                  class="small tag"
                  style="display: inline-block; margin-top: 4px"
                >
                  Active maintenant
                </div>
              </div>
              <button class="btn danger" data-action="revoke">Révoquer</button>
            </div>
          </div>
        </section>
      </div></template
    >
    <template id="admin-template"
      ><div>
        <div class="notice">
          Mode mock administrateur · les modifications sont conservées dans
          localStorage.
        </div>
        <div class="grid two">
          <div class="card">
            <div class="section-title">
              <h2>Jeux (<span data-games-count></span>)</h2>
              <button class="btn primary" data-action="add">＋ Créer</button>
            </div>
            <div class="list" data-admin-games></div>
          </div>
          <div class="card">
            <h2>Opérations</h2>
            <div class="stat" data-account-count></div>
            <div class="muted">comptes mock actifs</div>
            <div
              class="stat"
              style="margin-top: 20px"
              data-configured-achievements
            ></div>
            <div class="muted">succès configurés</div>
          </div>
        </div>
      </div></template
    >
    <template id="empty-admin-template"
      ><div class="empty">Accès opérateur réservé à Alice.</div></template
    >
    <template id="admin-game-template"
      ><div class="list-item">
        <div class="grow">
          <b data-game-name></b>
          <div class="small muted" data-game-meta></div>
        </div>
        <button class="btn" data-action="editgame">Éditer</button>
      </div></template
    >
    <template id="modal-template"
      ><div id="modal" class="modal-back">
        <div class="token-modal-card" style="padding: 24px">
          <div class="row" style="margin-bottom: 20px">
            <h2 style="font-weight: 900" data-modal-title></h2>
            <button class="btn" style="padding: 8px" data-close-modal>
              <i data-lucide="x"></i>
            </button>
          </div>
          <div data-modal-body></div>
        </div></div
    ></template>
    <template id="launch-modal-template"
      ><div class="notice" data-launch-text></div>
      <div
        style="
          height: 150px;
          margin-top: 14px;
          border-radius: 12px;
          background: var(--primary-grad);
          display: grid;
          place-items: center;
          font-size: 26px;
          color: #fff;
          font-weight: 900;
        "
      >
        <i
          data-lucide="play"
          style="width: 48px; height: 48px; margin-bottom: 10px"
        ></i
        ><br />PLAYING
      </div></template
    >
    <template id="form-modal-template"
      ><div class="form">
        <input class="input" data-form-name placeholder="Nom du jeu" /><input
          class="input"
          data-form-genre
          placeholder="Genre / catégorie"
        /><button class="btn primary" data-form-submit>Enregistrer</button>
      </div></template
    >
    <template id="profile-modal-template"
      ><div class="form">
        <input class="input" data-form-profile-name /><select class="input">
          <option>En ligne</option>
          <option>Absent</option>
          <option>Invisible</option></select
        ><button class="btn primary" data-form-submit>Enregistrer</button>
      </div></template
    >
    <template id="invite-modal-template"
      ><div class="form">
        <input class="input" placeholder="Nom ou identifiant" /><button
          class="btn primary"
          data-form-submit
        >
          Envoyer
        </button>
      </div></template
    >

    <script src="script.js"></script>
  </body>
</html>
