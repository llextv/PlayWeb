<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Websteam // Arcade cloud</title>
  <meta name="description"
    content="Plateforme de jeux web avec comptes, tokens, bibliothèque, succès, amis, classement, notifications, administration, monétisation et accessibilité.">
  <style>
    :root {
      --bg: #090e16;
      --panel: #111a27;
      --panel2: #162335;
      --line: #26374a;
      --text: #e9f2f5;
      --muted: #8ca0ae;
      --accent: #46e0b2;
      --accent2: #78a7ff;
      --warn: #ffc857;
      --danger: #ff7187;
      --shadow: 0 22px 60px #0007
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: radial-gradient(circle at 70% -10%, #173346 0, #090e16 48%);
      color: var(--text);
      font: 15px Outfit, sans-serif;
      min-height: 100vh
    }

    button,
    input,
    select {
      font: inherit
    }

    button {
      cursor: pointer;
      border: 0
    }

    .hidden {
      display: none !important
    }

    .app {
      display: flex;
      min-height: 100vh
    }

    .sidebar {
      width: 260px;
      padding: 28px 18px;
      border-right: 1px solid var(--line);
      background: #0b121cdd;
      backdrop-filter: blur(18px);
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 5
    }

    .brand {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 0 12px 36px;
      font-weight: 800;
      letter-spacing: -.04em;
      font-size: 22px
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: #071310;
      border-radius: 11px;
      transform: rotate(-8deg);
      font-size: 18px
    }

    .eyebrow,
    .mono {
      font: 11px 'DM Mono', monospace;
      letter-spacing: .12em;
      text-transform: uppercase
    }

    .eyebrow {
      color: var(--accent)
    }

    .nav {
      display: grid;
      gap: 7px
    }

    .nav button {
      padding: 12px 14px;
      text-align: left;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      transition: .2s;
      display: flex;
      gap: 12px;
      align-items: center
    }

    .nav button:hover,
    .nav button.active {
      background: linear-gradient(90deg, #193a3a, #152739);
      color: var(--text)
    }

    .nav button.active {
      box-shadow: inset 3px 0 var(--accent);
      color: var(--accent)
    }

    .side-foot {
      position: absolute;
      bottom: 22px;
      left: 28px;
      right: 28px;
      color: var(--muted);
      font-size: 12px
    }

    .user-mini {
      border-top: 1px solid var(--line);
      padding-top: 15px;
      margin-top: 18px;
      display: flex;
      gap: 10px;
      align-items: center
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #4777ff, #a4f7df);
      color: #071310;
      font-weight: 800
    }

    .main {
      margin-left: 260px;
      flex: 1;
      padding: 28px 4vw 60px;
      max-width: 1500px
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px
    }

    .topbar h1 {
      font-size: clamp(26px, 3vw, 42px);
      margin: 4px 0;
      letter-spacing: -.06em
    }

    .top-actions {
      display: flex;
      gap: 10px;
      align-items: center
    }

    .chip {
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 99px;
      color: var(--muted);
      font-size: 13px
    }

    .btn {
      padding: 11px 15px;
      border-radius: 10px;
      background: var(--panel2);
      border: 1px solid var(--line);
      color: var(--text);
      transition: .2s
    }

    .btn:hover {
      border-color: var(--accent);
      transform: translateY(-1px)
    }

    .btn.primary {
      background: var(--accent);
      color: #071712;
      border-color: var(--accent);
      font-weight: 700
    }

    .btn.danger {
      color: var(--danger)
    }

    .hero {
      background: linear-gradient(110deg, #163c45, #15243b 60%, #192342);
      border: 1px solid #2b5963;
      border-radius: 20px;
      padding: 28px;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow);
      margin-bottom: 28px
    }

    .hero:after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      border: 1px solid #79f4d544;
      border-radius: 50%;
      right: -50px;
      top: -110px;
      box-shadow: 0 0 0 24px #79f4d511, 0 0 0 48px #79f4d508
    }

    .hero h2 {
      font-size: clamp(25px, 4vw, 48px);
      line-height: .98;
      margin: 10px 0;
      max-width: 600px;
      letter-spacing: -.06em
    }

    .hero p {
      color: #b7cad3;
      max-width: 520px
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px
    }

    .grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr))
    }

    .card {
      background: linear-gradient(145deg, #121d2b, #101824);
      border: 1px solid var(--line);
      border-radius: 15px;
      padding: 19px;
      min-width: 0;
      animation: rise .35s both
    }

    .card:hover {
      border-color: #3d6574
    }

    .game-card {
      padding: 0;
      overflow: hidden
    }

    .cover {
      height: 145px;
      background: linear-gradient(135deg, #264f55, #2b2a57);
      display: flex;
      align-items: end;
      padding: 15px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -.05em
    }

    .cover.orange {
      background: linear-gradient(135deg, #70472c, #262c59)
    }

    .cover.pink {
      background: linear-gradient(135deg, #743c60, #233d5b)
    }

    .card-body {
      padding: 15px
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px
    }

    .muted {
      color: var(--muted)
    }

    .small {
      font-size: 12px
    }

    .tag {
      color: var(--accent);
      font-size: 12px
    }

    .stat {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -.05em
    }

    .section {
      margin: 30px 0
    }

    .section-title {
      display: flex;
      align-items: end;
      justify-content: space-between;
      margin-bottom: 14px
    }

    .section-title h2 {
      font-size: 22px;
      margin: 0;
      letter-spacing: -.04em
    }

    .progress {
      height: 7px;
      border-radius: 9px;
      background: #263442;
      overflow: hidden;
      margin: 13px 0
    }

    .progress i {
      display: block;
      height: 100%;
      background: var(--accent);
      border-radius: inherit
    }

    .list {
      display: grid;
      gap: 10px
    }

    .list-item {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 13px;
      border-bottom: 1px solid #223041
    }

    .list-item:last-child {
      border: 0
    }

    .grow {
      flex: 1;
      min-width: 0
    }

    .badge {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #203c48;
      display: grid;
      place-items: center;
      color: var(--accent);
      font-size: 19px
    }

    .table {
      width: 100%;
      border-collapse: collapse
    }

    .table th,
    .table td {
      text-align: left;
      padding: 13px 9px;
      border-bottom: 1px solid var(--line);
      font-size: 13px
    }

    .table th {
      color: var(--muted);
      font: 11px 'DM Mono';
      text-transform: uppercase
    }

    .notice {
      padding: 14px;
      border: 1px solid #356458;
      background: #14332f;
      border-radius: 11px;
      color: #c9fae9
    }

    .tabs {
      display: flex;
      gap: 8px;
      overflow: auto;
      margin-bottom: 18px
    }

    .tabs .btn {
      white-space: nowrap
    }

    .empty {
      padding: 45px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 14px
    }

    .form {
      display: grid;
      gap: 11px;
      max-width: 480px
    }

    .input {
      width: 100%;
      background: #0b131e;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 12px
    }

    .login {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: radial-gradient(circle at 15% 20%, #164a4d, #090e16 42%), #090e16
    }

    .login-box {
      width: min(470px, 100%);
      padding: 34px;
      background: #101a27eF;
      border: 1px solid #315260;
      border-radius: 22px;
      box-shadow: var(--shadow)
    }

    .login-box h1 {
      font-size: 42px;
      margin: 8px 0;
      letter-spacing: -.07em
    }

    .token {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 11px;
      margin-top: 8px;
      background: #0b141e;
      border-radius: 9px;
      color: #b4c8d0;
      font: 12px 'DM Mono'
    }

    .token code {
      color: var(--accent)
    }

    .toast-wrap {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 20;
      display: grid;
      gap: 9px
    }

    .toast {
      background: #152536;
      border: 1px solid #3b6471;
      border-left: 3px solid var(--accent);
      padding: 13px 16px;
      border-radius: 10px;
      box-shadow: var(--shadow);
      animation: slide .25s both
    }

    .modal-back {
      position: fixed;
      inset: 0;
      background: #0009;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 20px
    }

    .modal {
      width: min(540px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px;
      box-shadow: var(--shadow)
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(7px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes slide {
      from {
        opacity: 0;
        transform: translateX(20px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @media(max-width:900px) {
      .sidebar {
        width: 76px;
        padding: 22px 10px
      }

      .brand {
        margin: 0 10px 30px;
        font-size: 0
      }

      .brand-mark {
        font-size: 18px
      }

      .nav button {
        justify-content: center;
        font-size: 0
      }

      .nav button:first-letter {
        font-size: 18px
      }

      .side-foot {
        left: 10px;
        right: 10px
      }

      .side-foot .user-mini {
        justify-content: center
      }

      .side-foot .grow,
      .side-foot .mono {
        display: none
      }

      .main {
        margin-left: 76px;
        padding: 24px 3vw
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }
    }

    @media(max-width:560px) {
      .main {
        padding: 18px 14px 45px
      }

      .topbar {
        align-items: flex-start
      }

      .top-actions .chip {
        display: none
      }

      .topbar h1 {
        font-size: 29px
      }

      .hero {
        padding: 22px
      }

      .grid,
      .grid.two {
        grid-template-columns: 1fr
      }

      .cover {
        height: 125px
      }

      .table {
        min-width: 510px
      }

      .table-wrap {
        overflow: auto
      }

      .login-box {
        padding: 25px
      }

      .side-foot {
        bottom: 14px
      }
    }

    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px
    }

    @media(prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important
      }
    }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: 8px;
      z-index: 99;
      background: var(--accent);
      color: #071712;
      padding: 10px 14px;
      border-radius: 8px
    }

    .skip-link:focus {
      left: 8px
    }
  </style>
</head>

<body><a class="skip-link" href="#content">Aller au contenu</a>
  <div id="root"></div>
  <div id="toast" class="toast-wrap" role="status" aria-live="polite"></div>
  </div>
  <script>
    'use strict';
    const KEY = 'websteam.session.v2', DATA = 'websteam.data.v2';
    const accounts = {
      'demo-token-alice': { id: 'alice', name: 'Alice', role: 'admin', avatar: 'A', level: 18, xp: 7420, status: 'En ligne', title: 'Curatrice du chaos' },
      'demo-token-bob': { id: 'bob', name: 'Bob', role: 'player', avatar: 'B', level: 11, xp: 4210, status: 'En ligne', title: 'Speedrunner' },
      'demo-token-claire': { id: 'claire', name: 'Claire', role: 'player', avatar: 'C', level: 14, xp: 5980, status: 'Absente', title: 'Exploratrice' }
    };
    const games = [{ id: 'neon', name: 'Neon Drift', genre: 'Course • Arcade', cover: '', tone: '', price: 0, players: '1.2k', desc: 'Dérapez dans une ville synthwave sans fin.' }, { id: 'orbit', name: 'Orbital Echo', genre: 'Puzzle • Solo', tone: 'orange', price: 4.99, players: '842', desc: 'Réparez une station oubliée en orbite.' }, { id: 'hollow', name: 'Hollow Signal', genre: 'Aventure • Narratif', tone: 'pink', price: 7.99, players: '310', desc: 'Un signal impossible venu des profondeurs.' }];
    const defaults = { owned: ['neon'], credits: 25, notifications: 2, achievements: [{ name: 'Premier tour', game: 'Neon Drift', icon: '✦', rare: 'Commun', done: true }, { name: 'Ligne parfaite', game: 'Neon Drift', icon: '◎', rare: 'Rare', done: true }, { name: 'Pas de retour', game: 'Hollow Signal', icon: '◈', rare: 'Légendaire', done: false }], friends: [{ name: 'Bob', status: 'En ligne', avatar: 'B' }, { name: 'Claire', status: 'En partie', avatar: 'C' }], sessions: 2 };
    let session = null, data = null, view = 'shop';
    if (typeof structuredClone !== 'function') { window.structuredClone = o => JSON.parse(JSON.stringify(o)) }
    function load() { try { session = JSON.parse(localStorage.getItem(KEY) || 'null'); data = JSON.parse(localStorage.getItem(DATA) || 'null') } catch (e) { session = null; data = null } if (session && !accounts[session.token]) { localStorage.removeItem(KEY); session = null } if (session && !data) data = structuredClone(defaults) }
    function save() { localStorage.setItem(KEY, JSON.stringify(session)); localStorage.setItem(DATA, JSON.stringify(data)) }
    function esc(s) { return String(s).replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c])) }
    function toast(msg) { let e = document.createElement('div'); e.className = 'toast'; e.textContent = msg; document.querySelector('#toast').append(e); setTimeout(() => e.remove(), 3000) }
    function user() { return accounts[session.token] }
    function shell() { document.querySelector('#root').innerHTML = `<div class="app"><aside class="sidebar"><div class="brand"><span class="brand-mark">W</span><span>WEBSTEAM<span style="color:var(--accent)">/</span></span></div><nav class="nav">${[['shop', '⌂', 'Boutique'], ['library', '▣', 'Bibliothèque'], ['friends', '♧', 'Amis'], ['achievements', '✦', 'Succès'], ['leaderboard', '↗', 'Leaderboard'], ['notifications', '◌', 'Notifications'], ['profile', '◎', 'Profil'], ...(user().role === 'admin' ? [['admin', '⚙', 'Admin']] : [])].map(x => `<button class="${view === x[0] ? 'active' : ''}" data-view="${x[0]}">${x[1]} <span>${x[2]}</span>${x[0] === 'notifications' && data.notifications ? `<b style="margin-left:auto;color:var(--accent)">${data.notifications}</b>` : ''}</button>`).join('')}</nav><div class="side-foot"><div class="user-mini"><div class="avatar">${user().avatar}</div><div class="grow"><b>${user().name}</b><br><span class="small muted">Niveau ${user().level}</span></div><button class="btn danger" id="logout" title="Déconnexion">↪</button></div></div></aside><main class="main" id="content"><header class="topbar"><div><div class="eyebrow">Arcade cloud / saison 04</div><h1 id="page-title"></h1></div><div class="top-actions"><span class="chip">✦ ${data.credits} crédits</span><button class="btn" id="quickProfile">${user().avatar} ${user().name}</button></div></header><div id="content-panel"></div></main></div>`; document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { view = b.dataset.view; render() }); document.querySelector('#logout').onclick = logout; document.querySelector('#quickProfile').onclick = () => { view = 'profile'; render() }; renderContent() }
    function render() { shell() }
    function renderContent() { let titles = { shop: 'Découvrir', library: 'Votre bibliothèque', friends: 'Équipage', achievements: 'Collection de succès', leaderboard: 'Classement', notifications: 'Centre de signaux', profile: 'Votre capsule', admin: 'Console opérateur' }; document.querySelector('#page-title').textContent = titles[view]; let f = { shop: shop, library: library, friends: friends, achievements: achievements, leaderboard: leaderboard, notifications: notifications, profile: profile, admin: admin }[view]; document.querySelector('#content-panel').innerHTML = f(); bind() }
    function shop() { return `<section class="hero"><div class="eyebrow">Nouveau signal détecté</div><h2>Jouez plus loin.<br><span style="color:var(--accent)">Restez connecté.</span></h2><p>Une sélection de jeux web propriétaires, instantanément jouables et synchronisés avec votre capsule.</p><button class="btn primary" onclick="document.querySelector('#games').scrollIntoView({behavior:'smooth'})">Explorer la vitrine ↓</button></section><div class="section-title"><h2>À la une</h2><span class="muted small">3 expériences sélectionnées</span></div><div class="grid" id="games">${games.map(gameCard).join('')}</div>` }
    function gameCard(g) { let owned = data.owned.includes(g.id); return `<article class="card game-card"><div class="cover ${g.tone}">${g.name}</div><div class="card-body"><div class="row"><div><b>${g.name}</b><div class="muted small">${g.genre}</div></div><span class="tag">${g.price ? g.price.toFixed(2) + ' €' : 'GRATUIT'}</span></div><p class="muted small">${g.desc}</p><button class="btn ${owned ? '' : 'primary'}" data-action="buy" data-id="${g.id}">${owned ? '✓ Dans la bibliothèque' : g.price ? 'Acheter' : 'Ajouter'}</button></div></article>` }
    function library() { let gs = games.filter(g => data.owned.includes(g.id)); return `<div class="notice">Votre progression est sauvegardée localement dans cette capsule. Aucun serveur requis.</div><section class="section"><div class="section-title"><h2>${gs.length} jeu${gs.length > 1 ? 'x' : ''} prêt${gs.length > 1 ? 's' : ''} à lancer</h2></div><div class="grid">${gs.length ? gs.map(g => `<article class="card game-card"><div class="cover ${g.tone}">${g.name}</div><div class="card-body"><b>${g.name}</b><div class="progress"><i style="width:${g.id === 'neon' ? 72 : 18}%"></i></div><div class="row small muted"><span>${g.id === 'neon' ? '72' : '18'}% exploré</span><button class="btn primary" data-action="launch" data-id="${g.id}">▶ Lancer</button></div></div></article>`).join('') : '<div class="empty">Votre bibliothèque attend sa première aventure.</div>'}</div></section>` }
    function friends() { return `<div class="grid two"><section class="card"><div class="section-title"><h2>Amis (${data.friends.length})</h2><button class="btn" data-action="invite">＋ Ajouter</button></div><div class="list">${data.friends.map(f => `<div class="list-item"><div class="avatar">${f.avatar}</div><div class="grow"><b>${f.name}</b><div class="small ${f.status === 'En ligne' ? 'tag' : 'muted'}">● ${f.status}</div></div><button class="btn" data-action="play" data-name="${f.name}">Inviter</button></div>`).join('')}</div></section><section class="card"><div class="eyebrow">Activité</div><h2>Invitations à jouer</h2><div class="empty">Aucune invitation en attente.<br><span class="small">Le chat reste hors fréquence, le jeu d'abord.</span></div></section></div>` }
    function achievements() { return `<div class="hero" style="padding:22px"><div class="row"><div><div class="eyebrow">Progression globale</div><h2 style="font-size:32px">${data.achievements.filter(a => a.done).length} / ${data.achievements.length} débloqués</h2></div><div class="stat" style="color:var(--accent)">68%</div></div><div class="progress"><i style="width:68%"></i></div></div><div class="grid">${data.achievements.map(a => `<article class="card"><div class="row"><div class="badge">${a.icon}</div><span class="tag">${a.rare}</span></div><h3>${a.name}</h3><div class="muted small">${a.game}</div><div style="margin-top:15px" class="${a.done ? 'tag' : 'muted'}">${a.done ? '✓ Débloqué' : '◌ À découvrir'}</div></article>`).join('')}</div>` }
    function leaderboard() { return `<div class="tabs"><button class="btn primary">Global</button><button class="btn">Amis</button><button class="btn">Cette saison</button><button class="btn">Cette semaine</button></div><div class="card table-wrap"><table class="table"><thead><tr><th>#</th><th>Joueur</th><th>Niveau</th><th>XP</th><th>Titre</th></tr></thead><tbody>${[['01', 'Alice', '18', '7 420', 'Curatrice'], ['02', 'Claire', '14', '5 980', 'Exploratrice'], ['03', 'Bob', '11', '4 210', 'Speedrunner'], ['04', 'Nova', '09', '3 880', 'Rookie']].map((r, i) => `<tr><td class="${i === 0 ? 'tag' : ''}">${r[0]}</td><td><b>${r[1]}</b></td><td>${r[2]}</td><td>${r[3]}</td><td class="muted">${r[4]}</td></tr>`).join('')}</tbody></table></div>` }
    function notifications() { return `<div class="card list">${['Votre session est sécurisée et active.', 'Bob vous a invité à jouer à Neon Drift.', 'Nouveau succès disponible : Ligne parfaite.'].map((n, i) => `<div class="list-item"><div class="badge">${i ? '✦' : '✓'}</div><div class="grow"><b>${n}</b><div class="small muted">Il y a ${i + 1} h</div></div><span class="tag">${i ? 'Nouveau' : 'Système'}</span></div>`).join('')}</div>` }
    function profile() { return `<div class="grid two"><section class="card"><div class="row"><div class="avatar" style="width:72px;height:72px;font-size:28px">${user().avatar}</div><span class="tag">● ${user().status}</span></div><h2>${user().name}</h2><div class="muted">${user().title}</div><div class="progress"><i style="width:74%"></i></div><div class="row small"><span>Niveau ${user().level}</span><span class="muted">${user().xp} XP</span></div><hr style="border-color:var(--line);border-width:1px 0 0;margin:22px 0"><button class="btn" data-action="edit">Modifier le profil</button></section><section class="card"><div class="eyebrow">Sécurité</div><h2>Sessions & tokens</h2><p class="muted small">Token actuel : <code>${session.token}</code></p><div class="list"><div class="list-item"><span class="badge">⌁</span><div class="grow"><b>Session navigateur</b><div class="small tag">Active maintenant</div></div><button class="btn danger" data-action="revoke">Révoquer</button></div></div></section></div>` }
    function admin() { if (user().role !== 'admin') return '<div class="empty">Accès opérateur réservé à Alice.</div>'; return `<div class="notice">Mode mock administrateur · les modifications sont conservées dans localStorage.</div><section class="section grid two"><div class="card"><div class="section-title"><h2>Jeux (${games.length})</h2><button class="btn primary" data-action="add">＋ Créer</button></div><div class="list">${games.map(g => `<div class="list-item"><div class="grow"><b>${g.name}</b><div class="small muted">${g.genre} · ${g.price ? 'Premium' : 'Gratuit'}</div></div><button class="btn" data-action="editgame" data-id="${g.id}">Éditer</button></div>`).join('')}</div></div><div class="card"><h2>Opérations</h2><div class="stat">${Object.keys(accounts).length}</div><div class="muted">comptes mock actifs</div><div class="stat" style="margin-top:20px">${data.achievements.length}</div><div class="muted">succès configurés</div></div></section>` }
    function bind() { document.querySelectorAll('[data-action]').forEach(b => b.onclick = () => action(b.dataset.action, b.dataset.id, b.dataset.name)) }
    function action(a, id, name) { if (a === 'buy') { let g = games.find(x => x.id === id); if (data.owned.includes(id)) { view = 'library'; render() } else if (g.price && data.credits < g.price) { toast('Crédits insuffisants pour cet achat.') } else { if (g.price) data.credits -= g.price; data.owned.push(id); save(); toast(`${g.name} ajouté à votre bibliothèque.`); render() } } else if (a === 'launch') { modal('Lancement sécurisé', `<div class="notice">${games.find(g => g.id === id).name} démarre dans une capsule de jeu mock.</div><div style="height:150px;margin-top:14px;border-radius:12px;background:repeating-linear-gradient(45deg,#122b38 0 10px,#183f48 10px 20px);display:grid;place-items:center;font-size:26px;color:var(--accent)">▶ PLAYING</div>`) } else if (a === 'play') toast(`Invitation envoyée à ${name}.`); else if (a === 'invite') modal('Ajouter un ami', '<div class="form"><input class="input" placeholder="Nom ou identifiant"><button class="btn primary" onclick="closeModal();toast(\'Invitation envoyée.\')">Envoyer</button></div>'); else if (a === 'edit') modal('Modifier le profil', '<div class="form"><input class="input" value="' + esc(user().name) + '"><select class="input"><option>En ligne</option><option>Absent</option><option>Invisible</option></select><button class="btn primary" onclick="closeModal();toast(\'Profil mis à jour.\')">Enregistrer</button></div>'); else if (a === 'revoke') { session = null; localStorage.removeItem(KEY); closeModal(); showLogin(); toast('Session révoquée.'); } else if (a === 'add' || a === 'editgame') modal(a === 'add' ? 'Créer un jeu' : 'Éditer le jeu', '<div class="form"><input class="input" placeholder="Nom du jeu" value="' + (id ? esc(games.find(g => g.id === id).name) : '') + '"><input class="input" placeholder="Genre / catégorie"><button class="btn primary" onclick="closeModal();toast(\'Jeu enregistré dans le mock.\')">Enregistrer</button></div>') }
    function modal(title, html) { let d = document.createElement('div'); d.id = 'modal'; d.className = 'modal-back'; d.innerHTML = `<div class="modal"><div class="row"><h2>${title}</h2><button class="btn" onclick="closeModal()">×</button></div>${html}</div>`; document.body.append(d) } function closeModal() { document.querySelector('#modal')?.remove() }
    function showLogin() { document.querySelector('#root').innerHTML = `<main class="login"><section class="login-box"><div class="brand" style="margin:0 0 28px;padding:0"><span class="brand-mark">W</span><span>WEBSTEAM<span style="color:var(--accent)">/</span></span></div><div class="eyebrow">Accès capsule</div><h1>Reprenez<br>la partie.</h1><p class="muted">Entrez votre token de démo pour synchroniser votre identité.</p><form id="loginForm" class="form"><input id="token" class="input" autocomplete="off" placeholder="demo-token-alice" required><button class="btn primary">Ouvrir la capsule →</button><div id="error" class="hidden" style="color:var(--danger)"></div></form><div style="margin-top:24px"><div class="eyebrow">Tokens de test</div>${Object.keys(accounts).map(t => `<div class="token"><code>${t}</code><button class="btn" data-token="${t}">Utiliser</button></div>`).join('')}</div></section></main>`; document.querySelectorAll('[data-token]').forEach(b => b.onclick = () => document.querySelector('#token').value = b.dataset.token); document.querySelector('#loginForm').onsubmit = e => { e.preventDefault(); let t = document.querySelector('#token').value.trim(); if (!accounts[t]) { let x = document.querySelector('#error'); x.textContent = 'Token invalide. Utilisez un token de démonstration ci-dessous.'; x.classList.remove('hidden'); return } session = { token: t, createdAt: Date.now() }; data = structuredClone(defaults); save(); toast('Connexion réussie.'); shell() } }
    function logout() { session = null; data = null; localStorage.removeItem(KEY); localStorage.removeItem(DATA); showLogin() }
    load(); session ? shell() : showLogin();
  </script>
